<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 2 – Coffee Shop Barista Agent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff5e6; padding: 40px; }
    .box {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; }
    #chat { border: 1px solid #ddd; padding: 10px; height: 200px; overflow-y: auto; border-radius: 8px; background: #fffaf3; }
    .msg { margin: 5px 0; }
    .me { font-weight: bold; }
    .bot { color: #8b4513; }
    textarea {
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 8px;
      resize: none;
      height: 60px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #8b4513;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #6b3410; }
    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>☕ Coffee Shop Barista Agent</h2>
    <div id="chat"></div>

    <textarea id="userInput" placeholder="Type your answer here..."></textarea>
    <button id="sendBtn">Send</button>

    <h3>Order JSON Summary</h3>
    <pre id="orderJson">{}</pre>
    <button id="downloadBtn" disabled>Download Order JSON</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
