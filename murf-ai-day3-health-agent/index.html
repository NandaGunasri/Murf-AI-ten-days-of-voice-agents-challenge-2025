<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 3 – Health & Wellness Voice Companion</title>
  <style>
    body {font-family:Arial;background:#e6fff2;padding:40px;}
    .box {max-width:500px;margin:auto;background:white;padding:20px;
          border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,0.1);}
    button {padding:10px 20px;background:#008060;color:white;border:none;
            border-radius:8px;margin-top:10px;cursor:pointer;}
    button:hover {background:#00664d;}
    textarea {width:100%;padding:10px;}
  </style>
</head>
<body>
  <div class="box">
    <h2>💚 Health & Wellness Voice Companion</h2>
    <p id="agentText">Hello! How are you feeling today?</p>
    <textarea id="userInput" rows="3"  placeholder="Type your response here..."></textarea><br>
    <button id="sendBtn">Reply</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
