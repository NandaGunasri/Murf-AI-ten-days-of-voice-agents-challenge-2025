<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Murf AI – Day 5 Zoho SDR Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Zoho SDR Voice Agent (Murf AI Day 5)</h1>
      <p>Simulated chat flow with FAQs and lead capture.</p>
    </header>

    <main class="chat-container">
      <div id="agentText" class="agent-text">
        <!-- Agent messages will appear here -->
      </div>

      <div id="faqSuggestions" class="faq-suggestions">
        <!-- FAQ suggestion buttons will be rendered here -->
      </div>

      <div class="input-row">
        <input
          id="userInput"
          type="text"
          placeholder="Type your answer or ask a question about Zoho CRM..."
        />
        <button id="sendBtn">Send</button>
      </div>
    </main>

    <footer class="app-footer">
      <small>Murf AI Ten Days of Voice Agents Challenge – Day 5</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
